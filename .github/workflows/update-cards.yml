name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # once daily at midnight UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=Skull-boy&show_icons=true&theme=onedark&hide_border=true&title_color=00E5FF&text_color=E6E6E6&icon_color=B537F2&bg_color=0A0A0A'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=Skull-boy&layout=compact&theme=onedark&hide_border=true&title_color=00E5FF&text_color=E6E6E6&bg_color=0A0A0A'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push
